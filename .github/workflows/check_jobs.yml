name: check-jobs

on:
  schedule:
    # Every 5 minutes -- GitHub's minimum. Was hourly; changed 2026-11 because a
    # ping an hour late can mean applying after the first wave of applicants.
    #
    # Free only because the repo is PUBLIC (unlimited Actions minutes). On a
    # private repo this would be ~8,600 billed minutes/month against a 2,000
    # free tier and Actions would stop within the first week -- go back to
    # hourly ("0 * * * *") if this repo is ever made private.
    #
    # Offset from :00 on purpose: GitHub delays (and under load drops) scheduled
    # runs most at the top of the hour. Expect real gaps of 5-15 minutes, not 5.
    # Simplify updates many times an hour, so the extra frequency pays off there.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log matches without sending to Discord"
        type: boolean
        default: false
      reseed:
        description: "Silently re-seed state (no notifications)"
        type: boolean
        default: false

# Required for the job to push the updated state file back.
permissions:
  contents: write

concurrency:
  # Never let two runs write seen.json at once.
  group: check-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new postings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.reseed }}" = "true" ]; then ARGS="$ARGS --reseed"; fi
          python src/main.py $ARGS

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ inputs.dry_run != true }}
        with:
          commit_message: "chore: update seen.json [skip ci]"
          file_pattern: state/seen.json
