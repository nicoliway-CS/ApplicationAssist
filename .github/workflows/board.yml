name: job-board

on:
  schedule:
    # Three times a day. Minute is :17, not :00 -- the top of the hour is the
    # most congested slot for GitHub's shared runners, so off-the-hour cuts the
    # scheduling delay.
    #
    # 11/17/23 UTC lands ~7 AM / 1 PM / 7 PM US Eastern during EDT (an hour
    # earlier during EST). All three are daytime ET and none is near 00:00 UTC,
    # so a delayed run can't slip across a calendar day -- the page stamps its
    # "rebuilt" date in America/New_York and it has to stay correct.
    #
    # workflow_dispatch below rebuilds on demand; a build outside these slots is
    # a manual run.
    - cron: "17 11,17,23 * * *"
  workflow_dispatch:

# `pages` + `id-token` are what actions/deploy-pages needs. `contents: read`
# only -- unlike check-jobs this workflow never writes back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages allows one in-flight deployment; cancel a superseded build rather
  # than queueing it. Distinct from the check-jobs group on purpose -- these
  # two touch nothing in common and should never block each other.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Reads state/seen.json from the checkout to mark rows NEW. That file is
      # committed hourly by check-jobs, so it is at most an hour stale here.
      - name: Render the board
        run: python scripts/render_board.py -o site/index.html --title "Job Board"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
