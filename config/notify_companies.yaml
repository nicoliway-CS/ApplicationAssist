# Companies worth a Discord ping.
#
# WHY THIS EXISTS
#   Every posting that passes the location/internship/category filters lands
#   on the board regardless of who posted it -- that pool is large. This list
#   is the noise control on top of it: Discord only fires for postings from a
#   company on this list. It is not a signal about sponsorship or eligibility
#   (there is none to track here -- see README), just "companies I actually
#   want pinged for." The role filter (SWE / AI-ML / Embedded only, see
#   role_categories.yaml) applies to every company here, hardware and
#   aerospace names included.
#
# THIS LIST IS YOURS
#   Add, remove, and regroup freely. Rebuilt 2026-11 from a hand-written list.
#   Removed then, so they never ping: Runway, Together AI, SambaNova, Cohere,
#   Hugging Face, Nuro, Vercel, Airtable, Instacart, Motorola Mobility.
#
# HOW MATCHING WORKS (src/filter.py CompanyMatcher)
#   Only the posting's company field is checked, never the title. Names are
#   lowercased, de-accented, and legal suffixes ("Inc", "LLC") stripped. An
#   entry matches when the company name STARTS with it as whole words:
#     "Amazon"  matches  "Amazon Web Services", "Amazon Robotics"
#     "Square"  does NOT match "Squarespace";  "Arm" does NOT match "Armadin"
#   Start-anchored, not anywhere-in-the-name: an anywhere match let "Applied
#   Materials" hit "Johns Hopkins Applied Physics Laboratory".
#
#   Some entries use a longer name than you'd say out loud ("Relativity Space",
#   "Lucid Motors", "Archer Aviation", "Aurora Innovation", "Fidelity
#   Investments") because the short name is ALSO a different company that posts
#   SWE internships (Relativity the legal-software company, Lucid Software,
#   Archer Daniels Midland, ...). Add the short form under `exact:` if a source
#   writes it bare.
#
# MAINTENANCE
#   Add a company: put it in the group that fits, shortest distinctive name.
#   Delete a whole group you've lost interest in -- the loader flattens
#   whatever groups remain, so removing one changes nothing else.

