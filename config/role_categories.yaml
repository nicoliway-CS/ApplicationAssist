# Positive-keyword screen that tags each posting with one or more role
# categories: software_engineering, machine_learning, embedded_systems,
# hardware_engineering.
#
# Same philosophy as the require_title_patterns screen the old eu-tech-jobs
# source used: a posting must look like the target role from its title,
# because a source's own category tag can't be trusted. Simplify ships its
# own `category` field (Software / Hardware / AI-ML-Data / Product / Quant)
# and it was checked before writing this file -- it is noisy in exactly the
# way eu-tech-jobs' role_family tag was. Sampled 2026-09 against
# Summer2027-Internships: the "Hardware" bucket contained "Software
# Development Intern", "Software Engineering Co-op - Fall 2026" and
# "Embedded Software Engineer Intern" alongside real hardware roles, so it
# is not usable as a filter on its own. Title keywords do the real work here.
#
# A posting can match more than one category -- "Embedded Software Engineer
# Intern" is genuinely both, and isn't forced to pick one. A posting matching
# NONE of the three is dropped, same as the old no_match behavior for
# non-CS roles, unless enable_other_category is turned on below.
#
# All patterns are matched as whole words/phrases against the normalized
# (lowercased, de-accented) title -- see compile_term_patterns in
# src/normalize.py. Whole-word matters here for the same reason it did in
# the old exclude_title_patterns: a bare-word screen invites false positives
# ("engineer" alone would tag every Sales Engineer and Field Engineer req as
# Software Engineering), so most entries below are qualified phrases, not
# single words.

options:
  # FPGA work straddles embedded and hardware. Defaulting to embedded because
  # most CS/CE new-grad-adjacent FPGA reqs are digital-logic/verification
  # work reached from an embedded-systems track, not analog/board-level
  # hardware -- but this is a judgment call, not a measurement. Set to
  # "hardware" or "both" if you disagree.
  fpga_category: embedded   # embedded | hardware | both

  # If true, a posting matching none of the three categories is kept and
  # tagged "other" instead of being dropped. Off by default -- flip it on
  # temporarily, look at what accumulates in the "other" bucket on the board,
  # and use it to find keyword gaps above, then turn it back off.
  enable_other_category: false

# Applied to whichever category (or categories) `fpga_category` selects above,
# so the term only has to be written once.
fpga_patterns:
  - fpga
  - field programmable gate array

categories:
  software_engineering:
    label: "Software Engineering"
    patterns:
      - software engineer
      - software engineering
      - software developer
      - software development
      - swe
      - sde
      - backend
      - back end
      - frontend
      - front end
      - full stack
      - fullstack
      - web developer
      - web engineer
      - mobile developer
      - ios developer
      - android developer
      - application developer
      - applications developer
      - programmer
      - devops
      - devsecops
      - site reliability
      - sre
      - platform engineer
      - cloud engineer
      - infrastructure engineer
      - systems programmer
      - distributed systems
      - compiler engineer
      - security engineer
      - application security
      - qa engineer
      - sdet
      - test engineer
      - test automation
      - data engineer
      # ML/AI engineer titles moved to machine_learning below. "Machine Learning
      # Software Engineer" still earns both via "software engineer" above.
      - game developer
      - game engineer

  machine_learning:
    label: "Machine Learning"
    # Added 2026-11. Before this category existed, ~1,600 active US internship
    # titles that read as ML/AI ("Machine Learning Intern", "Research Scientist
    # Intern", "AI/ML Engineering Co-op") matched nothing and were dropped.
    #
    # Bare "ai" is deliberately NOT a pattern: sampled titles include "AI
    # Solutions Intern - Human Resources", "Global Marketing AI & Data Intern"
    # and "Business Analytics AI Co-op". Every "ai" entry below is qualified.
    # Bare "ml" IS here -- in a job title it essentially always means machine
    # learning. Data science / analytics titles are left out on purpose (mostly
    # dashboards and SQL, not ML); add "data scientist" here if you want them.
    patterns:
      - machine learning
      - ml
      - mlops
      - ai/ml
      - ml/ai
      - ai engineer
      - ai engineering
      - ai developer
      - ai software
      - ai research
      - ai researcher
      - ai infrastructure
      - ai platform
      - ai safety
      - ai model
      - ai models
      - applied ai
      - generative ai
      - genai
      - physical ai
      - embodied ai
      - artificial intelligence
      - deep learning
      - neural network
      - neural networks
      - computer vision
      - natural language processing
      - nlp
      - speech recognition
      - reinforcement learning
      - llm
      - llms
      - large language model
      - large language models
      - foundation model
      - foundation models
      - multimodal
      - perception
      - prompt engineer
      # Research/applied-scientist interns on these boards are overwhelmingly ML
      # (Meta, Microsoft, Amazon, ByteDance). Broader than the rest of this
      # list -- narrow it if non-ML research roles start showing up.
      - research scientist
      - applied scientist
      - applied science

  embedded_systems:
    label: "Embedded Systems"
    patterns:
      - embedded
      - embedded systems
      - embedded software
      - embedded engineer
      - firmware
      - firmware engineer
      - rtos
      - real-time operating system
      - real time operating system
      - microcontroller
      - iot
      - internet of things
      - device driver
      - driver development
      - bare metal
      - baremetal
      - low-level software
      - low level software
      - avionics software
      - flight software

  hardware_engineering:
    label: "Hardware Engineering"
    patterns:
      - hardware engineer
      - hardware engineering
      - hardware design
      - pcb
      - printed circuit board
      - asic
      - vlsi
      - digital design
      - rtl design
      - rtl engineer
      - verilog
      - vhdl
      - chip design
      - ic design
      - soc design
      - silicon engineer
      - semiconductor engineer
      - analog design
      - mixed signal
      - signal integrity
      - hardware design engineer
      - avionics hardware
      # Bare below, deliberately broader than everything above -- kept at the
      # requester's explicit ask rather than silently narrowed. "Electrical
      # Engineer" alone can't be told apart from a power-grid/building-systems
      # EE role by keyword matching alone; it is a real gap. If it proves
      # noisy in practice, replace it with qualified phrases like the ones
      # above (asic/vlsi/digital-design engineer) instead of the bare term.
      - electrical engineer
      - electrical engineering
